<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Neon glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient -->
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#050505"/>

  <!-- Symbol: sharp fractured F -->
  <g filter="url(#glow)">
    <path d="M18 16 H46 V22 H26 V30 H42 V36 H26 V48 H18 Z"
          fill="url(#red)"/>

    <!-- fracture / slash -->
    <polygon points="34,14 38,14 28,50 24,50"
             fill="#ff3333" opacity="0.7"/>
  </g>

  <!-- subtle glitch line -->
  <rect x="14" y="40" width="36" height="2" fill="#ff1a1a" opacity="0.4"/>
</svg>