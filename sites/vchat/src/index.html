<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vchat</title>
<style>
:root{--bg:#0d1b21;--surface:#142a31;--line:#25434d;--text:#dfeae6;--muted:#8fa8a8;--lagoon:#5fd0c0;--amber:#ffb347;--danger:#ff7a6b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
.app{min-height:100%;display:flex;flex-direction:column}
.app:focus{outline:none}
h1{font-size:2rem;line-height:1.15;letter-spacing:-.02em;margin:0 0 .5rem}
h2{font-size:1.05rem;margin:0 0 .5rem}
label{display:grid;gap:.35rem;font-size:.9rem;color:var(--muted)}
input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:.65rem .75rem;font:inherit;min-width:0}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:6px;padding:.6rem 1rem;cursor:pointer}
button:hover{border-color:var(--lagoon)}
button.primary{background:var(--lagoon);border-color:var(--lagoon);color:#06231f;font-weight:600}
button.danger{background:var(--danger);border-color:var(--danger);color:#2b0803;font-weight:600}
button.quiet{background:none;border-color:transparent;color:var(--muted)}
button[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}
.error{color:var(--danger);margin:0}
.error[hidden]{display:none}
.stack{display:grid;gap:1rem}
.gate{margin:auto;width:min(420px,92vw);padding:2rem 0}
.lede{color:var(--muted);margin:0 0 1.5rem;max-width:42ch}
.bar{display:flex;align-items:center;gap:1rem;padding:.75rem 1.25rem;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:-.01em;margin-right:auto}
.room-name{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;color:var(--muted)}
.lobby-body{width:min(760px,92vw);margin:3rem auto;display:grid;gap:1.5rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.25rem;display:grid;gap:.75rem;align-content:start}
.panel p{margin:0;color:var(--muted)}
.room{display:flex;flex-direction:column;height:100vh}
.room-main{flex:1;display:grid;grid-template-columns:1fr 320px;min-height:0}
.stage{display:flex;flex-direction:column;min-height:0;padding:1rem;gap:.75rem}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));grid-auto-rows:1fr;gap:.75rem;min-height:0}
.tile{margin:0;position:relative;background:#081217;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:160px}
.tile video{width:100%;height:100%;object-fit:cover;display:block}
.tile figcaption{position:absolute;left:.5rem;bottom:.5rem;background:rgba(8,18,23,.75);padding:.15rem .5rem;border-radius:4px;font-size:.85rem}
.controls{display:flex;justify-content:center;gap:.75rem}
.status{margin:0;text-align:center;color:var(--muted);min-height:1.5em;font-size:.9rem}
.chat{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:1rem;gap:.75rem;background:var(--surface)}
.chat-log{list-style:none;margin:0;padding:0;flex:1;overflow-y:auto;display:grid;align-content:start;gap:.5rem}
.chat-log li{display:grid;gap:.1rem;overflow-wrap:anywhere}
.chat-log b{font-size:.8rem;color:var(--muted);font-weight:600}
.chat-log li.me b{color:var(--lagoon)}
#chat-form{display:flex;gap:.5rem}
#chat-input{flex:1}
.badge{font-size:.8rem;padding:.2rem .6rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.badge:empty{display:none}
.badge.on{border-color:var(--lagoon);color:var(--lagoon)}
.badge.off{border-color:var(--amber);color:var(--amber)}
.safety{font-size:.85rem;color:var(--muted)}
.safety ul{list-style:none;padding:0;margin:.5rem 0;display:grid;gap:.25rem}
.safety code{color:var(--lagoon);font-family:ui-monospace,Menlo,monospace}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:860px){.room-main{grid-template-columns:1fr;grid-template-rows:1fr 260px}.chat{border-left:0;border-top:1px solid var(--line)}.split{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app" class="app"></main>
<script type="module" src="/vchat-client.js"></script>
</body>
</html>
