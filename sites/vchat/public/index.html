<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>vchat</title>
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#07030d">
    <style>
        html {
            background: #07030d
        }
    </style>
    <script>
          // pick the saved theme's stylesheet before first paint (default: phantom)
          (function () {
            var map = { cyan: 'vchat', blackout: 'blackout', phantom: 'phantom' };
            var id = 'phantom';
            try { id = localStorage.getItem('vchat:theme') || id; } catch (e) {}
            var file = map[id] || 'phantom';
            document.write('<link id="theme-css" rel="stylesheet" href="/assets/css/' + file + '.css?v=__BUILD__">');
          })();
    </script>
</head>

<body>
    <main id="app" class="app"></main>

    <script>
          try {
            var t = localStorage.getItem('vchat-theme');
            if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
          } catch (e) {}
    </script>
    <script type="module" src="/vchat-client.js"></script>
</body>
</html>
