version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: fear-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-fear_db}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - fear-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # FEAR Application
  fear-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fear-app
    restart: unless-stopped
    ports:
      # HTTP port
      - "${NODE_PORT:-4000}:${NODE_PORT:-4000}"
      # HTTPS ports
      - "443:443"
      - "3443:3443"
      # HTTP redirect port
      - "80:80"
    environment:
      # Node Environment
      NODE_ENV: ${NODE_ENV:-production}
      NODE_PORT: ${NODE_PORT:-4000}
      
      # Database Configuration
      DB_LINK: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/${MONGO_DATABASE:-fear_db}?authSource=admin
      
      # Session Configuration
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret-key}
      
      # HTTPS Configuration
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      HTTPS_MODE: ${HTTPS_MODE:-manual}
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-localhost}
      HTTPS_EMAIL: ${HTTPS_EMAIL:-admin@example.com}
      SSL_CERT_PATH: ${SSL_CERT_PATH:-/app/certificates/certificate.crt}
      SSL_KEY_PATH: ${SSL_KEY_PATH:-/app/certificates/private.key}
      SSL_CA_PATH: ${SSL_CA_PATH:-/app/certificates/ca-bundle.crt}
      
      # CORS Configuration
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4000}
      
      # Payment Processors (optional)
      ADD_PAYMENTS: ${ADD_PAYMENTS:-false}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      
      # Email Configuration (optional)
      MAIL_SERVICE: ${MAIL_SERVICE:-google}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      
      # Application Configuration
      FEAR_LOGO: ${FEAR_LOGO:-}
      DOMAIN: ${DOMAIN:-localhost}
      
    volumes:
      # SSL Certificates (for manual mode)
      - ./certificates:/app/certificates:ro
      # Greenlock data (for auto-encrypt)
      - greenlock_data:/app/greenlock.d
      # Auto-encrypt data
      - auto_encrypt_data:/app/.small-tech.org
      # Application logs
      - ./logs:/app/logs
      # React build (if building separately)
      - ./backend/admin/build:/app/backend/admin/build:ro
      # Development mode: mount source code
      # - ./src:/app/src:ro
      # - ./routes:/app/routes:ro
      # - ./libs:/app/libs:ro
    networks:
      - fear-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${NODE_PORT:-4000}/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Express (Optional - for database management)
  mongo-express:
    image: mongo-express:1.0-20
    container_name: fear-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-pass}
    networks:
      - fear-network
    depends_on:
      - mongodb
    profiles:
      - dev

networks:
  fear-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  greenlock_data:
    driver: local
  auto_encrypt_data:
    driver: local
