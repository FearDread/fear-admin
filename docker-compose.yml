# docker-compose.yml
version: '3.8'
services:
  fear-api:
    build: .
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/fear_db
      - ALLOWED_ORIGINS=https://yourdomain.com
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:5.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

volumes:
  mongodb_data: